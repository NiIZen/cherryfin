# Template for packages/org.cherryfin.webos.yml in webosbrew/apps-repo.
# Before submitting, add screenshots and test on a real TV.
title: Cherryfin
iconUri: https://github.com/NiIZen/cherryfin/releases/latest/download/icon160.png
manifestUrl: https://github.com/NiIZen/cherryfin/releases/latest/download/org.cherryfin.webos.manifest.json
category: multimedia
pool: main
requirements:
  webosRelease: "5.0"
shortDescription: Jellyfin client with an interface in the style of tvOS
description: |
  Cherryfin is an unofficial client for your own Jellyfin server, with a calm interface
  in the style of tvOS and full control with the remote.

  - Libraries as sections of their own, with an A–Z overview and a letter bar
  - Shows, movies, search, my list and "Continue watching"
  - Direct playback through the TV's media player; the server only converts when needed
  - Customizable look: colors, sizes, grid or list, rows and sections
  - English and German interface

  A Jellyfin server of your own is required. Without a server, a demo mode shows the interface.
  Not affiliated with Apple or the Jellyfin project.

  AI assistance (Claude) was used in development.
